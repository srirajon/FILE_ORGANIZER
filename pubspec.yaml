name: file_organizer
description: "Mobile organizer app where files are shared to folders styled as WhatsApp conversational contacts."
publish_to: 'none'
version: 1.3.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  receive_sharing_intent: ^1.8.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  open_filex: ^5.0.0
  file_picker: ^13.1.0
  http: ^1.6.0
  url_launcher: ^6.3.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
